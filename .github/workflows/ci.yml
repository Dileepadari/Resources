name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shelf:
    name: Every document still opens and the attribution resolves
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A repository of binary files fails quietly. A truncated commit or a bad
      # Git LFS migration leaves a file that is still present, still roughly the
      # right size in a listing, and no longer a document anything can open. The
      # check reads the PDF header, the trailer and the page objects directly,
      # and refuses to pass if it finds no PDFs at all.
      #
      # It also resolves the attribution links, because an attribution that
      # points nowhere is not attribution.
      - name: Check the shelf
        run: python scripts/check.py

      - name: No emoji, em dashes or decorative arrows
        run: |
          if grep -rnP '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}\x{2190}-\x{21FF}\x{2014}\x{2013}]' --include='*.md' --include='*.py' --include='NOTICE' .; then
            echo "Found emoji, an em/en dash or an arrow"
            exit 1
          fi
          echo "clean"
